<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="royal-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E3192;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1B1464;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F9A602;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D4AF37;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="10" />
      <feOffset dx="0" dy="10" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Main circle background -->
  <circle cx="400" cy="400" r="380" fill="url(#royal-gradient)" filter="url(#shadow)" />
  
  <!-- Crown element -->
  <g transform="translate(400, 240) scale(1.3)">
    <path d="M-120,50 L-40,-70 L0,40 L40,-70 L120,50 L65,50 L65,110 L-65,110 L-65,50 Z" 
          fill="url(#gold-gradient)" stroke="#F9A602" stroke-width="5" />
    <circle cx="-80" cy="-20" r="15" fill="#F9A602" stroke="#D4AF37" stroke-width="3" />
    <circle cx="0" cy="-30" r="15" fill="#F9A602" stroke="#D4AF37" stroke-width="3" />
    <circle cx="80" cy="-20" r="15" fill="#F9A602" stroke="#D4AF37" stroke-width="3" />
  </g>
  
  <!-- XR Text -->
  <text x="400" y="500" font-family="Arial, sans-serif" font-weight="bold" font-size="160" fill="#FFFFFF" text-anchor="middle">iTeachXR</text>
  
  <!-- Tagline -->
  <text x="400" y="560" font-family="Arial, sans-serif" font-style="italic" font-size="40" fill="#F9A602" text-anchor="middle">Excellence in Education</text>
  
  <!-- Decorative elements -->
  <g>
    <!-- Left flourish -->
    <path d="M180,520 C220,500 240,470 240,440 C240,400 200,380 180,400 C160,420 180,460 220,460" 
          stroke="#F9A602" stroke-width="5" fill="none" />
    <!-- Right flourish -->
    <path d="M620,520 C580,500 560,470 560,440 C560,400 600,380 620,400 C640,420 620,460 580,460" 
          stroke="#F9A602" stroke-width="5" fill="none" />
  </g>
</svg>