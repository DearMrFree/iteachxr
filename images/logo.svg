<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="800" height="800" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
  <g>
    <!-- Main circular background shape -->
    <path d="M400,50 C195.4,50 30,215.4 30,420 C30,624.6 195.4,790 400,790 C604.6,790 770,624.6 770,420 C770,215.4 604.6,50 400,50 Z" 
          fill="#B91539" />
    
    <!-- White swoosh elements -->
    <path d="M170,130 C250,180 300,250 320,400 C330,520 300,650 220,750 C100,650 30,530 30,420 C30,280 85,160 170,130 Z" 
          fill="white" />
    <path d="M450,100 C550,150 650,280 700,350 C720,380 750,420 750,450 C600,320 500,280 320,400 C250,450 200,520 180,600 C150,500 200,400 300,300 C400,200 450,150 450,100 Z" 
          fill="white" />
    
    <!-- Light bulb in center -->
    <g transform="translate(400, 500) scale(1.2)">
      <!-- Bulb outline -->
      <rect x="-70" y="-150" width="140" height="200" rx="70" ry="70" stroke="white" stroke-width="4" fill="none" />
      
      <!-- Bulb body -->
      <circle cx="0" cy="-70" r="50" fill="white" />
      
      <!-- Filaments -->
      <line x1="0" y1="-40" x2="0" y2="-90" stroke="white" stroke-width="4" />
      <line x1="-15" y1="-60" x2="-15" y2="-90" stroke="white" stroke-width="4" />
      <line x1="15" y1="-60" x2="15" y2="-90" stroke="white" stroke-width="4" />
      
      <!-- Bulb base -->
      <rect x="-25" y="10" width="50" height="8" fill="white" />
      <rect x="-25" y="24" width="50" height="8" fill="white" />
      <circle cx="0" cy="50" r="15" fill="white" />
    </g>
    
    <!-- XR text -->
    <text x="600" y="720" font-family="Arial, sans-serif" font-weight="bold" font-size="120" fill="white">XR</text>
  </g>
